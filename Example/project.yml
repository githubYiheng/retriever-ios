# xcodegen 2.45：`xcodegen generate` 生成 RetrieverExample.xcodeproj（gitignored）。
name: RetrieverExample
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Retriever:
    path: ..
targets:
  RetrieverExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loomalabs.retriever-example
        DEVELOPMENT_TEAM: R22CUP27Y4
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Retriever 示例
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: Retriever
        product: Retriever
      - package: Retriever
        product: RetrieverSwiftLog
      - package: Retriever
        product: RetrieverCocoaLumberjack
schemes:
  RetrieverExample:
    build:
      targets:
        RetrieverExample: all
    run:
      config: Debug
